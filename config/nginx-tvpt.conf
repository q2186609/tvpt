
# 明文 HTTP 入口：只给局域网/调试用（模拟器通过 adb reverse 直连 127.0.0.1）。
# 生产走上面 443 的 server 块。
server {
    listen 80;
    server_name _;
    client_max_body_size 8m;

    location /api/tv/ {
        proxy_pass http://tvapi:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;   # 保留 :8082，直链改写要用
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://seedstrem:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # seedstrem 的 302 用自己配置里的 external_url（公网域名）拼 Location。
        # 局域网/调试端口访问时那台机器没有这个域名，客户端一跟跳转就
        # "unable to resolve host"。统一改写成和本次请求同一个源。
        proxy_redirect ~^https?://[^/]+(/.*)$ $scheme://$http_host$1;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

server {
    listen 443 ssl;
    # 注意: 不要开 http2。实测 Stremio TV 走 HTTP/2 时会拿到"未找到流媒体"
    # (上游是 chunked 响应, 经 h2 转发后客户端解析失败), 关掉 h2 用 1.1 就正常。
    # http2 on;
    server_name tvpt.example.com;

    # 证书来自仓库 certs/ (Let's Encrypt, DNS-01 签发)
    ssl_certificate     /etc/nginx/certs/tvpt.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/tvpt.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 给电视端 Clash 拉取的配置（加了一条 qzz.io 直连规则）
    location /clash/ {
        alias /usr/share/nginx/clash/;
        default_type text/yaml;
        add_header Cache-Control "no-store";
    }

    # 电视客户端（自建 APK）的元数据与片源聚合层
    location /api/tv/ {
        proxy_pass http://tvapi:8080;
        proxy_http_version 1.1;
        # $http_host 保留端口：tvapi 用 r.Host 改写片源直链，$host 会把
        # ":8082" 去掉，客户端就会去连 80 端口
        proxy_set_header Host $http_host;
        # tvapi 用它把片源直链改写成"和这次请求同一个源"; 少了这个头，
        # 客户端拿到的是 http:// 链接，在 https 的电视端会被拦掉
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Stremio 从 https 侧拉 manifest / 元数据 / 片源直链
    location / {
        proxy_pass http://seedstrem:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        # 同 HTTP 块：302 的 Location 用 external_url 域名拼，改写成同源
        proxy_redirect ~^https?://[^/]+(/.*)$ $scheme://$http_host$1;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 边下边播：必须关缓冲、放宽超时，否则大文件播放被截断
        proxy_buffering            off;
        proxy_request_buffering    off;
        proxy_connect_timeout      30s;
        proxy_send_timeout         900s;
        proxy_read_timeout         900s;
        chunked_transfer_encoding  on;
    }
}
