# tvpt PoC: Prowlarr (PT search) + qBittorrent (download/seed) + seedstrem (Stremio addon)
#
# 数据流:
#   Stremio --stream request--> seedstrem --search--> Prowlarr --> PT 站
#      ^                          |
#      |                          +--add torrent--> qBittorrent (下载 + 做种)
#      +--播放 http://nas:8081/...--+ 从共享卷读取边下边播
#
# 合规红线:
#   1. addon 只返回 stream.url, 不返回 infoHash, 避免 passkey 经 magnet 泄露。
#   2. qBittorrent 与 seedstrem 必须挂载同一个宿主目录, 否则流式读取找不到文件。
#   3. seedstrem 不做 PT 特有的事, 做种策略由 seedstrem 配置 + qBittorrent 队列共同控制。

services:
  qbittorrent:
    # 4.6.7 + libtorrent 1.2.19: 顺序下载 + 首尾片优先都正常, 边下边播需要
    # 一个从第 0 字节开始的连续前缀。
    # 注意 qB 5.3 + libtorrent 2.0 实测: seq_dl 标志为 true 但片段被拆成多个
    # extent 分散下载, 前缀长期为 0, 且 setFirstLastPiecePriority 接口已移除(404)。
    # 用 Docker Hub 官方名而非 lscr.io: 本机的 registry mirror 只对 Docker Hub 生效,
    # lscr.io 走直连会被重置。两个名字是同一个镜像。
    image: ${QBITTORRENT_IMAGE:-linuxserver/qbittorrent:4.6.7-libtorrentv1}
    container_name: tvpt-qbittorrent
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - WEBUI_PORT=8080
      # 不能用 6881: 该端口是 BitTorrent 传统默认端口段, 多数 PT 站列入黑名单
      # (实测某 PT 站返回 "Port 6881 is blacklisted"), 端口映射需与下方保持一致
      - TORRENTING_PORT=${TORRENTING_PORT:-45001}
    volumes:
      - ./data/qbittorrent-config:/config
      - ./data/downloads:/downloads
    ports:
      - "8080:8080"
      - "${TORRENTING_PORT:-45001}:${TORRENTING_PORT:-45001}"
      - "${TORRENTING_PORT:-45001}:${TORRENTING_PORT:-45001}/udp"
    restart: unless-stopped

  prowlarr:
    # 同 qbittorrent: 走 Docker Hub 以命中本机 registry mirror
    image: linuxserver/prowlarr:latest
    container_name: tvpt-prowlarr
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./data/prowlarr-config:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  seedstrem:
    # 自建镜像: 在官方 v0.3.0 基础上把 magnet-less 索引器的 .torrent 抓取
    # 从串行改成并发。某 PT 站这类私有站不返回 magnet/infoHash, 原版会为每条
    # 结果串行下载 .torrent 算 hash (实测 1.3-2s/条), 9 条结果要 12-18 秒,
    # 超出 Stremio 的等待窗口导致"没有片源"。改造后总耗时降到最慢一条的水平。
    #
    # 本地构建: cd vendor/seedstrem && \
    #   docker build --network=host -f Dockerfile.patch -t tvpt/seedstrem:patched .
    # 若要用回官方镜像: 设 SEEDSTREM_IMAGE=ghcr.nju.edu.cn/kipsilabs/seedstrem:latest
    image: ${SEEDSTREM_IMAGE:-tvpt/seedstrem:patched}
    container_name: tvpt-seedstrem
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Asia/Shanghai}
      - SEEDSTREM_QBITTORRENT_URL=http://qbittorrent:8080
      - SEEDSTREM_QBITTORRENT_USERNAME=${QB_USERNAME:-admin}
      - SEEDSTREM_QBITTORRENT_PASSWORD=${QB_PASSWORD}
      - SEEDSTREM_QBITTORRENT_CATEGORY=tvpt
      - SEEDSTREM_PROWLARR_URL=http://prowlarr:9696
      - SEEDSTREM_PROWLARR_API_KEY=${PROWLARR_API_KEY}
      # Stremio 客户端实际访问的地址, 必须是 NAS 的局域网 IP
      - SEEDSTREM_SERVER_EXTERNAL_URL=${TVPT_EXTERNAL_URL}
      # 镜像里把库路径写死成 /config/seedstrem.db（env 覆盖 config.yaml），
      # 必须在这里覆盖到 named volume 上，否则配置里改路径不生效。
      - SEEDSTREM_STORAGE_DATABASE=/config/db/seedstrem.db
    volumes:
      # seedstrem 会把自己生成的 admin 密码和 Web UI 的改动写回 /config/config.yaml,
      # 因此这个目录必须可写。模板由 scripts/setup.sh 在首次启动前拷入。
      - ./data/seedstrem-config:/config
      # 数据库单独放 named volume：Windows 上 bind mount 走 9p，SQLite 的
      # WAL/locking 在 9p 上不可靠（实测容器内的连接和宿主看到的行数会不一致），
      # named volume 落在 Docker 虚拟机的 ext4 上，行为正常。
      - seedstrem-db:/config/db
      # 与 qBittorrent 的 /downloads 指向同一个宿主目录
      - ./data/downloads:/data
    ports:
      - "8081:8080"
    depends_on:
      - qbittorrent
      - prowlarr
    restart: unless-stopped

  # 电视客户端的元数据与片源聚合层
  # TMDB key 只放在服务端；客户端只认 /api/tv/*。
  tvapi:
    build: ./server/tvapi
    image: tvpt/tvapi:latest
    container_name: tvpt-tvapi
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - SEEDSTREM_BASE=http://seedstrem:8080
      # 国内直连 TMDB 会被 DNS 污染, 走宿主机的 Clash(与 Prowlarr 同一依赖)
      - HTTPS_PROXY=${TVAPI_PROXY:-http://host.docker.internal:7800}
      - HTTP_PROXY=${TVAPI_PROXY:-http://host.docker.internal:7800}
      # 图片可直连(image.tmdb.org), 绕开代理可把海报加载从 40s 级降到 1s 级
      - NO_PROXY=seedstrem,localhost,127.0.0.1,qbittorrent,prowlarr,image.tmdb.org
      # 下载页要直接问 qB 要列表/暂停/删除（内网服务名，走 NO_PROXY）
      - QB_URL=http://qbittorrent:8080
      - QB_USERNAME=${QB_USERNAME:-admin}
      - QB_PASSWORD=${QB_PASSWORD}
    depends_on:
      - seedstrem
    restart: unless-stopped

volumes:
  # seedstrem 的 SQLite 库：见上面 seedstrem.volumes 的说明
  seedstrem-db:
